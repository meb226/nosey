<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Gabarito:wght@400..900&family=Space+Grotesk:wght@400..700&family=Familjen+Grotesk:wght@400..700&family=Darker+Grotesque:wght@300..900&family=Outfit:wght@400..800&family=Epilogue:wght@400..800&family=Zilla+Slab:wght@400;500;600;700&family=Rokkitt:wght@400..800&family=Literata:opsz,wght@7..72,400..700&display=swap">
  <style>
    body { margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
    a { color: #f0bc52; } a:hover { color: #1e241f; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 375px; min-height: 1400px; background: radial-gradient(130% 40% at 50% 0%, #3d9979 0%, #2d7a5f 70%); color: #f7f3e8; display: flex; flex-direction: column; gap: 14px; padding: 30px 20px 28px;">

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.0; letter-spacing: -0.025em;">Ten faces</h1>
    <span style="font-size: 14px; font-weight: 500; color: #cfe6da; text-wrap: pretty;">Each shown at the sizes it would actually run at — the bottle name, then one accordion row. Tap a card to try it on the rest.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 9px;">
    <sc-for list="{{faces}}" as="f" hint-placeholder-count="10">
      <button onClick="{{f.pick}}" style="display: block; width: 100%; text-align: left; border-radius: 12px; border: 2px solid #1e241f; overflow: hidden; padding: 0; background: {{f.shell}}; box-shadow: {{f.shadow}}; transform: {{f.lift}};">

        <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 0;">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7f867e;">{{f.name}}</span>
          <span style="font-size: 11px; font-weight: 600; color: {{f.tagColor}};">{{f.tag}}</span>
        </span>

        <span style="display: block; padding: 2px 12px 4px; font-family: {{f.family}}; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; color: #1e241f; line-height: 1.1;">Clos des Briords</span>

        <span style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 10px 10px; padding: 8px 11px; border-radius: 9px; border: 2px solid #1e241f; background: #ffffff; font-family: {{f.family}};">
          <span style="display: flex; align-items: center; gap: 8px;">
            <span style="width: 12px; height: 12px; border-radius: 4px; border: 2px solid #1e241f; background: #9f7ce0;"></span>
            <span style="font-size: 15px; font-weight: 700; color: #1e241f;">Tannin</span>
            <span style="display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 999px; border: 1.5px solid #7f867e; font-size: 11px; font-weight: 700; color: #7f867e;">i</span>
          </span>
          <span style="display: flex; align-items: center; gap: 7px;">
            <span style="font-size: 18px; font-weight: 700; color: #1e241f;">medium+</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1e241f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </span>

      </button>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { chosen: 'Bricolage Grotesque' };
  }

  renderVals() {
    const FACES = [
      { name: 'Bricolage Grotesque', stack: "'Bricolage Grotesque', system-ui, sans-serif", tag: 'where you are now' },
      { name: 'Gabarito', stack: 'Gabarito, system-ui, sans-serif', tag: 'roundest, most legible' },
      { name: 'Space Grotesk', stack: "'Space Grotesk', system-ui, sans-serif", tag: 'quirky, a bit techy' },
      { name: 'Familjen Grotesk', stack: "'Familjen Grotesk', system-ui, sans-serif", tag: 'quiet character' },
      { name: 'Darker Grotesque', stack: "'Darker Grotesque', system-ui, sans-serif", tag: 'condensed, saves width' },
      { name: 'Outfit', stack: 'Outfit, system-ui, sans-serif', tag: 'geometric, very clean' },
      { name: 'Epilogue', stack: 'Epilogue, system-ui, sans-serif', tag: 'sharp, editorial sans' },
      { name: 'Zilla Slab', stack: "'Zilla Slab', Georgia, serif", tag: 'slab — serious, wine-list' },
      { name: 'Rokkitt', stack: 'Rokkitt, Georgia, serif', tag: 'slab, narrower and warmer' },
      { name: 'Literata', stack: 'Literata, Georgia, serif', tag: 'bookish, built for screens' },
    ];

    const chosen = this.state.chosen;

    return {
      faces: FACES.map((f) => {
        const on = f.name === chosen;
        return {
          name: f.name,
          family: f.stack,
          tag: f.tag,
          tagColor: on ? '#1e241f' : '#a8ada6',
          shell: on ? '#f0bc52' : '#fbf6ec',
          shadow: on ? '0 1px 0 0 #1e241f' : '0 2px 0 0 #1e241f',
          lift: on ? 'translateY(1px)' : 'translateY(0)',
          pick: () => this.setState({ chosen: f.name }),
        };
      }),
    };
  }
}
</script>
</body>
</html>
