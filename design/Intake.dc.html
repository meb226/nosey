<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400..800&display=swap">
  <style>
    body { margin: 0; font-family: Epilogue, system-ui, sans-serif; }
    a { color: #211d26; } a:hover { color: #211d26; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    button { font-family: inherit; cursor: pointer; }
    input, textarea { font-family: inherit; font-size: 16px; }
  </style>
</helmet>

<div style="width: 375px; min-height: 1240px; background: linear-gradient(180deg, #ac82ee 0%, {{ground}} 46%); color: #211d26; display: flex; flex-direction: column;">

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 32px 20px 12px;">

    <div style="display: flex; flex-direction: column; gap: 5px;">
      <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.028em; line-height: 1.02;">New session</h1>
      <span style="font-size: 15px; font-weight: 500; color: #211d26; text-wrap: pretty;">Photograph both labels. Everything read off them is yours to correct.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 13px; padding: 15px 14px; border-radius: 12px; border: 2px solid #211d26; background: #f7f4ef; color: #211d26;">
      <div style="display: grid; grid-template-columns: 88px 1fr; gap: 10px;">
        
  <label style="display: flex; flex-direction: column; gap: 6px; ">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7d7686;">No.</span>
    <input value="8" style="width: 100%; min-height: 46px; padding: 0 12px; border-radius: 9px; border: 2px solid #e4ddd2; background: #ffffff; color: #211d26; outline: none;">
  </label>
        
  <label style="display: flex; flex-direction: column; gap: 6px; ">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7d7686;">Module</span>
    <input value="Whites, week 3" style="width: 100%; min-height: 46px; padding: 0 12px; border-radius: 9px; border: 2px solid #e4ddd2; background: #ffffff; color: #211d26; outline: none;">
  </label>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7d7686;">What is this flight testing</span>
        <textarea rows="2" style="width: 100%; padding: 11px 12px; border-radius: 9px; border: 2px solid #e4ddd2; background: #ffffff; color: #211d26; outline: none; resize: none;">Same grape, stainless vs. oak</textarea>
      </label>
    </div>

    <sc-for list="{{bottles}}" as="b" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 13px; padding: 15px 14px; border-radius: 12px; border: 2px solid #211d26; background: #f7f4ef; color: #211d26;">

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <span style="display: flex; align-items: center; gap: 10px;">
            <span style="width: 17px; height: 17px; border-radius: 5px; border: 2px solid #211d26; background: {{b.chip}};"></span>
            <span style="font-size: 16px; font-weight: 700; letter-spacing: -0.012em;">{{b.title}}</span>
          </span>
          <sc-if value="{{b.read}}" hint-placeholder-val="{{true}}">
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #211d26; background: #f2ac13; border: 2px solid #211d26; border-radius: 999px; padding: 3px 9px;">Check it</span>
          </sc-if>
        </div>

        <sc-if value="{{b.read}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 13px;">
            <div style="display: flex; align-items: center; justify-content: center; height: 104px; border-radius: 9px; border: 2px solid #e4ddd2; background: #efe9df; color: #7d7686; gap: 8px;">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"></path><circle cx="12" cy="12.5" r="3.4"></circle>
              </svg>
              <span style="font-size: 13px; font-weight: 600;">Label photo</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
              
  <label style="display: flex; flex-direction: column; gap: 6px; grid-column: span 2;">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7d7686;">Producer</span>
    <input value="Domaine de la Pépière" style="width: 100%; min-height: 46px; padding: 0 12px; border-radius: 9px; border: 2px solid #e4ddd2; background: #ffffff; color: #211d26; outline: none;">
  </label>
              
  <label style="display: flex; flex-direction: column; gap: 6px; grid-column: span 2;">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7d7686;">Cuvée</span>
    <input value="Clos des Briords" style="width: 100%; min-height: 46px; padding: 0 12px; border-radius: 9px; border: 2px solid #e4ddd2; background: #ffffff; color: #211d26; outline: none;">
  </label>
              
  <label style="display: flex; flex-direction: column; gap: 6px; ">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7d7686;">Grape</span>
    <input value="Melon de Bourgogne" style="width: 100%; min-height: 46px; padding: 0 12px; border-radius: 9px; border: 2px solid #e4ddd2; background: #ffffff; color: #211d26; outline: none;">
  </label>
              
  <label style="display: flex; flex-direction: column; gap: 6px; ">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7d7686;">Region</span>
    <input value="Muscadet" style="width: 100%; min-height: 46px; padding: 0 12px; border-radius: 9px; border: 2px solid #e4ddd2; background: #ffffff; color: #211d26; outline: none;">
  </label>
              
  <label style="display: flex; flex-direction: column; gap: 6px; ">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7d7686;">Vintage</span>
    <input value="2022" style="width: 100%; min-height: 46px; padding: 0 12px; border-radius: 9px; border: 2px solid #e4ddd2; background: #ffffff; color: #211d26; outline: none;">
  </label>
              
  <label style="display: flex; flex-direction: column; gap: 6px; ">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7d7686;">ABV</span>
    <input value="12" style="width: 100%; min-height: 46px; padding: 0 12px; border-radius: 9px; border: 2px solid #e4ddd2; background: #ffffff; color: #211d26; outline: none;">
  </label>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{b.empty}}" hint-placeholder-val="{{true}}">
          <button onClick="{{b.shoot}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; width: 100%; height: 148px; border-radius: 9px; border: 2px dashed #7d7686; background: #ffffff; color: #211d26;">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"></path><circle cx="12" cy="12.5" r="3.4"></circle>
            </svg>
            <span style="font-size: 16px; font-weight: 700;">Photograph the label</span>
            <span style="font-size: 13px; font-weight: 500; color: #7d7686;">or fill it in yourself</span>
          </button>
        </sc-if>

      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="padding: 12px 20px 20px;">
    <button style="width: 100%; min-height: 54px; border-radius: 12px; border: 2px solid #211d26; background: #211d26; color: #f6f2ea; font-size: 17px; font-weight: 700;">Start tasting</button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"ground":{"editor":"color","options":["#9d6ee8","#b46ad6","#8a7cf5","#6042a8"],"default":"#9d6ee8","section":"Theme"}}'>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { shot: [true, false] }; }
  renderVals() {
    const shot = this.state.shot;
    return {
      ground: this.props.ground ?? '#9d6ee8',
      bottles: [0, 1].map((i) => ({
        title: 'Bottle ' + (i + 1),
        chip: ['#16b070', '#7c4ceb'][i],
        read: shot[i],
        empty: !shot[i],
        shoot: () => {
          const next = shot.slice();
          next[i] = true;
          this.setState({ shot: next });
        },
      })),
    };
  }
}

</script>
</body>
</html>
