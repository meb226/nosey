<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #6b2440; } a:hover { color: #4e1a2f; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 375px; min-height: 880px; background: #faf7f2; color: #1a1614; display: flex; flex-direction: column;">

  <div style="display: flex; flex-direction: column; gap: 24px; padding: 32px 24px 12px;">

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #8a7f78;">Bottle 1 of 2</span>
      <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.15; text-wrap: pretty;">Clos des Briords</h1>
      <span style="font-size: 15px; color: #8a7f78;">Muscadet Sèvre et Maine · 2022</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
        <div style="border-bottom: 1px solid #e3dcd2;">

          <button onClick="{{row.toggle}}" style="width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; background: none; border: none; text-align: left;">
            <span style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: {{row.labelColor}};">{{row.label}}</span>
              <span style="display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 999px; border: 1px solid #b8ada4; font-size: 10px; font-weight: 600; color: #8a7f78;">i</span>
            </span>
            <span style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 16px; color: {{row.valueColor}};">{{row.valueText}}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a7f78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform: {{row.caret}};">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>

          <sc-if value="{{row.isOpen}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-direction: column; gap: 6px; padding: 2px 0 14px;">
              <sc-for list="{{row.options}}" as="opt" hint-placeholder-count="5">
                <button onClick="{{opt.pick}}" style="width: 100%; min-height: 46px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border-radius: 8px; border: 1px solid; font-size: 16px; background: {{opt.bg}}; border-color: {{opt.bc}}; color: {{opt.fg}};">
                  <span>{{opt.label}}</span>
                  <span style="display: flex; gap: 3px; align-items: center;">
                    <sc-for list="{{opt.pips}}" as="pip" hint-placeholder-count="5">
                      <span style="width: 5px; height: 5px; border-radius: 999px; background: {{pip.color}};"></span>
                    </sc-for>
                  </span>
                </button>
              </sc-for>
            </div>
          </sc-if>

        </div>
      </sc-for>
    </div>

  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 12px 24px 20px; background: #faf7f2;">
    <button style="width: 100%; min-height: 52px; border-radius: 12px; border: none; background: #6b2440; color: #ffffff; font-size: 16px; font-weight: 500;">Save and pour the next</button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"openAxis":{"editor":"enum","options":["nose_intensity","acidity","tannin","body"],"default":"acidity","section":"Demo"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      open: null,
      picked: { nose_intensity: 'medium+', nose_words: 'lemon, chalk, sea air', sweetness: 'dry' },
    };
  }

  axes() {
    const L = ['low', 'medium-', 'medium', 'medium+', 'high'];
    return [
      { key: 'nose_intensity', label: 'Nose intensity', options: L },
      { key: 'sweetness', label: 'Sweetness', options: ['bone dry', 'dry', 'off-dry', 'medium sweet', 'sweet'] },
      { key: 'acidity', label: 'Acidity', options: L },
      { key: 'tannin', label: 'Tannin', options: L },
      { key: 'body', label: 'Body', options: L },
      { key: 'alcohol', label: 'Alcohol', options: L },
      { key: 'finish', label: 'Finish', options: ['short', 'medium', 'long'] },
    ];
  }

  renderVals() {
    const axes = this.axes();
    const open = this.state.open === null ? (this.props.openAxis ?? 'acidity') : this.state.open;

    const rows = axes.map((a, i) => {
      const value = this.state.picked[a.key] ?? null;
      const isOpen = open === a.key;
      return {
        label: a.label,
        isOpen: isOpen,
        valueText: value ?? '',
        valueColor: value ? '#1a1614' : '#c4b9b0',
        labelColor: isOpen ? '#6b2440' : '#8a7f78',
        caret: isOpen ? 'rotate(180deg)' : 'rotate(0deg)',
        toggle: () => this.setState({ open: isOpen ? '' : a.key }),
        options: a.options.map((o, j) => {
          const on = value === o;
          return {
            label: o,
            bg: on ? '#6b2440' : '#ffffff',
            bc: on ? '#6b2440' : '#e3dcd2',
            fg: on ? '#ffffff' : '#1a1614',
            // A small intensity read-out, so low-to-high is visible as well as readable.
            pips: a.options.map((_, k) => ({
              color: k <= j ? (on ? 'rgba(255,255,255,0.9)' : '#c4b9b0') : (on ? 'rgba(255,255,255,0.25)' : '#ece6dd'),
            })),
            pick: () => {
              const next = Object.assign({}, this.state.picked);
              next[a.key] = o;
              const following = axes[i + 1];
              this.setState({ picked: next, open: following ? following.key : '' });
            },
          };
        }),
      };
    });

    return { rows: rows };
  }
}
</script>
</body>
</html>
