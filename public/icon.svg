<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#dfa3f5"/>
  <defs>
    <clipPath id="bowl">
      <path d="M170 122 H342 C342 212 310 260 256 260 C202 260 170 212 170 122 Z"/>
